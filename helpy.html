<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpy</title>
    <link rel="stylesheet" href="helpy.css">
</head>
<body>

    <div class="helpy-container">
        <h2>Helpy</h2>
        
        <form id="helpyForm">
            <div class="form-row">
                <div class="form-group">
                    <input type="text" id="nome" placeholder="Seu nome" required>
                </div>

                <div class="form-group">
                    <div class="select-box" id="selectBox">Selecione as opções</div>
                    <div class="checkbox-options" id="checkboxOptions">
                        <label><input type="checkbox" value="Opção 1"> Opção 1</label>
                        <label><input type="checkbox" value="Opção 2"> Opção 2</label>
                        <label><input type="checkbox" value="Opção 3"> Opção 3</label>
                        <label><input type="checkbox" value="Opção 4"> Opção 4</label>
                    </div>
                </div>
            </div>

            <textarea id="descricao" placeholder="Descreva seu problema" required></textarea>

            <button type="submit" class="btn-submit">Enviar solicitação</button>
        </form>
    </div>

    <script src="helpy.js"></script>
</body>
</html>
